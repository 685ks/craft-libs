# cargo-deny configuration for the craft-libs workspace.
# CI runs `cargo deny check licenses advisories` (see .github/workflows/ci.yml).
# Run it locally with `cargo deny check licenses advisories`.

[graph]
all-features = true
# Check every target the Craft apps ship on, so platform-only crates are included.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
# RustSec advisories for vulnerabilities, unsoundness and yanked versions fail the check.
# Unmaintained crates are reported for workspace dependencies only.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained and has no maintained drop-in replacement yet. craft-pdf uses it
    # only in tests, and krilla (vendored) reaches it through rustybuzz. Revisit when krilla
    # moves to skrifa/harfrust for shaping.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no replacement yet; test-only in craft-pdf, transitive via krilla" },
]

[licenses]
# Every licence here is compatible with distributing the apps under MIT OR Apache-2.0.
# Copyleft licences are not listed: a crate that offers only those fails the check.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates and the git-only printing helper are not published to crates.io.
ignore = false
