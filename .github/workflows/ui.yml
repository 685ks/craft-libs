name: Shared UI

on:
  push:
    branches: [main]
    paths: ["crates/ui/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["crates/ui/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ui.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    timeout-minutes: 30
    name: UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: craft-ui
      - run: cargo fmt --check
      - run: cargo clippy -p craft-ui --all-targets --locked -- -D warnings
      - run: cargo clippy -p craft-ui --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p craft-ui --locked
      - run: cargo test -p craft-ui --all-features --locked
  wasm:
    timeout-minutes: 15
    name: UI WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: craft-ui-wasm
      - run: cargo check -p craft-ui --all-features --locked --target wasm32-unknown-unknown
