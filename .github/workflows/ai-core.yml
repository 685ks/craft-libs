name: AI model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/ai-core/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ai-core.yml']
  pull_request:
    paths: ['crates/ai-core/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ai-core.yml']

permissions:
  contents: read

concurrency:
  group: ai-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-core:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy -p craft-ai-core --all-targets --locked -- -D warnings
      - run: cargo test -p craft-ai-core --locked
      # The model promises to compile for the web.
      - run: cargo check -p craft-ai-core --target wasm32-unknown-unknown --locked
