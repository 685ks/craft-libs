name: Workspace CI

# Builds, lints and tests every crate in the workspace on Windows, checks
# dependency licences and advisories, and reports public API changes. The per-crate workflows
# keep their extra platform checks (WASM, ACLs, print queues, PDF fonts).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Release pins
        run: scripts/check-version.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: workspace
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories

  semver:
    name: API changes (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Informational while the workspace is 0.y.z: a breaking change is reported as a warning
      # on the run, not a failed check. craft-pdf is left out because cargo-semver-checks builds
      # each crate outside the workspace, without the [patch.crates-io] vendored hayro and
      # krilla it needs, so its rustdoc cannot be built there.
      - id: semver
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          exclude: craft-pdf
      - name: Report the result
        if: always()
        env:
          OUTCOME: ${{ steps.semver.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            echo "No breaking public API changes against the base branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=API changes::cargo-semver-checks reported breaking changes or could not run; see the semver step log."
            echo "cargo-semver-checks reported breaking changes or could not run (informational)." >> "$GITHUB_STEP_SUMMARY"
          fi
