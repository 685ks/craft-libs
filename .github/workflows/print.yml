name: Print spooler
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/print/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/print.yml']
  pull_request:
    paths: ['crates/print/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/print.yml']
permissions:
  contents: read
jobs:
  print:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -p craft-print --all-targets -- -D warnings
      - name: Prepare the Windows test driver
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Start-Service Spooler
          Add-PrinterDriver -Name 'Generic / Text Only'
      - run: cargo test -p craft-print --locked -- --nocapture
        timeout-minutes: 10
        env:
          CRAFT_PRINT_REQUIRE_QUEUE: ${{ runner.os == 'Windows' && '1' || '0' }}
