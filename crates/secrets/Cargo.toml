[package]
name = "craft-secrets"
description = "OS keychain storage for the secrets a Craft SecretRef names, with an in-memory store for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-ai-core = { workspace = true }

# macOS Keychain, Windows Credential Manager, and the Secret Service (GNOME Keyring, KWallet)
# over a pure-Rust D-Bus client on Linux and the BSDs, so no system library is needed to build.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
